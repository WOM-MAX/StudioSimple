<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad3)"/>

  <!-- Edificio estilizado a la izquierda -->
  <g transform="translate(80, 25)">
    <!-- Silueta del edificio -->
    <rect x="0" y="0" width="200" height="330" rx="16" fill="url(#bldgGrad)" stroke="#CBD5E1" stroke-width="2.5"/>
    
    <!-- Pisos (8 pisos representados) -->
    <!-- Piso 8 -->
    <line x1="0" y1="42" x2="200" y2="42" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="28" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#64748B">Piso 8</text>
    
    <!-- Piso 7 (Inicio) -->
    <line x1="0" y1="84" x2="200" y2="84" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="70" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#1E293B">Piso 7</text>
    <circle cx="12" cy="66" r="4" fill="#0284C7"/>

    <!-- Pisos intermedios -->
    <line x1="0" y1="126" x2="200" y2="126" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="112" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Piso 6</text>

    <line x1="0" y1="168" x2="200" y2="168" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="154" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Piso 5</text>

    <line x1="0" y1="210" x2="200" y2="210" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="196" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Piso 4</text>

    <line x1="0" y1="252" x2="200" y2="252" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="238" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Piso 3</text>

    <!-- Piso 2 (Llegada) -->
    <line x1="0" y1="294" x2="200" y2="294" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="25" y="280" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#1E293B">Piso 2</text>
    <circle cx="12" cy="276" r="4" fill="#0284C7"/>

    <!-- Piso 1 -->
    <text x="25" y="318" font-family="Nunito, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Piso 1</text>

    <!-- Hueco del ascensor central -->
    <rect x="90" y="0" width="85" height="330" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Cabina del ascensor en movimiento -->
    <rect x="95" y="140" width="75" height="58" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <rect x="105" y="148" width="55" height="30" rx="4" fill="#FDE68A"/>
    <text x="132" y="168" font-family="Nunito, sans-serif" font-size="12" font-weight="900" fill="#92400E" text-anchor="middle">Ascensor</text>

    <!-- Flecha dinámica descendente de movimiento -->
    <line x1="132" y1="70" x2="132" y2="270" stroke="#EA580C" stroke-width="4" stroke-dasharray="6,4"/>
    <polygon points="126,270 138,270 132,284" fill="#EA580C"/>
  </g>

  <!-- Tarjeta explicativa lateral -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="240" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <rect x="20" y="20" width="110" height="24" rx="6" fill="#FFF7ED"/>
    <text x="75" y="36" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#C2410C" text-anchor="middle">DESPLAZAMIENTO</text>

    <text x="20" y="75" font-family="Nunito, sans-serif" font-size="17" font-weight="900" fill="#1C3257">Baja 5 pisos</text>

    <text x="20" y="110" font-family="Nunito, sans-serif" font-size="13" font-weight="600" fill="#64748B">Indica un cambio de lugar,</text>
    <text x="20" y="130" font-family="Nunito, sans-serif" font-size="13" font-weight="600" fill="#64748B">la dirección hacia abajo y la</text>
    <text x="20" y="150" font-family="Nunito, sans-serif" font-size="13" font-weight="600" fill="#64748B">distancia que recorre.</text>

    <rect x="20" y="180" width="200" height="46" rx="12" fill="#EA580C"/>
    <text x="120" y="202" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#FFEDD5" text-anchor="middle">REPRESENTA UN</text>
    <text x="120" y="218" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">MOVIMIENTO</text>
  </g>
</svg>
