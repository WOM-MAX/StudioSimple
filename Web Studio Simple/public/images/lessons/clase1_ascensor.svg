<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="32" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Desplazamiento en un Edificio</text>
  <text x="300" y="50" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Situación: Un ascensor que baja 5 pisos</text>

  <!-- Esquema horizontal de pisos y desplazamiento -->
  <g transform="translate(120, 75)">
    <!-- Piso 7 -->
    <rect x="0" y="20" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="40" y="50" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle">Piso 7</text>

    <!-- Flecha de descenso de 5 pisos -->
    <line x1="95" y1="45" x2="255" y2="45" stroke="#EE751C" stroke-width="3" stroke-linecap="round"/>
    <polygon points="265,45 252,38 252,52" fill="#EE751C"/>
    <text x="175" y="35" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#EE751C" text-anchor="middle">Baja 5 pisos</text>

    <!-- Piso 2 -->
    <rect x="280" y="20" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="320" y="50" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle">Piso 2</text>
  </g>
</svg>
