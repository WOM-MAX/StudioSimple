<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad4)"/>

  <!-- Tarjeta de cuenta bancaria a la izquierda -->
  <g transform="translate(60, 60)">
    <!-- Tarjeta moderna -->
    <rect x="0" y="0" width="260" height="260" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Chip y logo -->
    <rect x="25" y="25" width="38" height="28" rx="6" fill="#FBBF24"/>
    <text x="235" y="44" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="end">MI BANCO</text>

    <!-- Etiqueta Saldo Disponible -->
    <text x="25" y="110" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Saldo en cuenta corriente</text>

    <!-- Monto negativo destacado en rojo suave -->
    <rect x="20" y="125" width="220" height="52" rx="12" fill="#7F1D1D" opacity="0.6"/>
    <text x="130" y="160" font-family="Nunito, sans-serif" font-size="28" font-weight="900" fill="#FCA5A5" text-anchor="middle">−$5.000</text>

    <!-- Estado -->
    <circle cx="32" cy="215" r="5" fill="#EF4444"/>
    <text x="46" y="219" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#F87171">Saldo deudor</text>
  </g>

  <!-- Tarjeta explicativa pedagógica a la derecha -->
  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="200" height="260" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="18" y="20" width="110" height="24" rx="6" fill="#FEF2F2"/>
    <text x="73" y="36" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">SIGNO NEGATIVO</text>

    <text x="18" y="75" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#1E293B">¿Qué significa?</text>

    <text x="18" y="105" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B">En el contexto bancario,</text>
    <text x="18" y="125" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B">un saldo positivo es dinero</text>
    <text x="18" y="145" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B">a favor y un signo negativo</text>
    <text x="18" y="165" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B">indica dinero adeudado.</text>

    <rect x="18" y="195" width="164" height="42" rx="10" fill="#DC2626"/>
    <text x="100" y="221" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">Deuda de $5.000</text>
  </g>
</svg>
