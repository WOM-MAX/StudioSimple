<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="34" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Estado de Cuenta Bancaria</text>
  <text x="300" y="52" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Registro del saldo en el resumen mensual</text>

  <!-- Tarjeta central limpia -->
  <g transform="translate(160, 70)">
    <rect x="0" y="0" width="280" height="130" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="25" y="32" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#64748B">Saldo en cuenta corriente:</text>
    
    <!-- Monto destacado neutro -->
    <rect x="25" y="45" width="230" height="50" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="140" y="80" font-family="Nunito, sans-serif" font-size="26" font-weight="900" fill="#DC2626" text-anchor="middle">−$5.000</text>
  </g>
</svg>
