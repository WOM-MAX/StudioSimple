<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Fondo cielo -->
  <rect x="0" y="0" width="600" height="70" fill="url(#skyGrad)"/>

  <!-- Mar -->
  <rect x="0" y="70" width="600" height="310" fill="url(#seaGrad)"/>

  <!-- Olas de superficie -->
  <path d="M0,70 Q25,64 50,70 T100,70 T150,70 T200,70 T250,70 T300,70 T350,70 T400,70 T450,70 T500,70 T550,70 T600,70 L600,80 L0,80 Z" fill="#38BDF8" opacity="0.7"/>

  <!-- Línea de referencia: 0 m -->
  <line x1="70" y1="70" x2="570" y2="70" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6,4"/>
  <rect x="360" y="42" width="200" height="24" rx="12" fill="#0C4A6E" opacity="0.85"/>
  <text x="460" y="58" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Superficie del mar: 0 m</text>

  <!-- Escala vertical de profundidad -->
  <line x1="80" y1="70" x2="80" y2="340" stroke="#7DD3FC" stroke-width="2"/>
  
  <!-- Marcas de escala -->
  <!-- 0 m -->
  <line x1="72" y1="70" x2="88" y2="70" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="62" y="74" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#0369A1" text-anchor="end">0 m</text>

  <!-- -10 m -->
  <line x1="75" y1="160" x2="85" y2="160" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="65" y="164" font-family="Nunito, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" text-anchor="end">−10 m</text>

  <!-- -20 m (Destacado) -->
  <line x1="70" y1="250" x2="90" y2="250" stroke="#F59E0B" stroke-width="3"/>
  <rect x="12" y="238" width="55" height="24" rx="6" fill="#F59E0B"/>
  <text x="39" y="255" font-family="Nunito, sans-serif" font-size="12" font-weight="900" fill="#78350F" text-anchor="middle">−20 m</text>

  <!-- -30 m -->
  <line x1="75" y1="330" x2="85" y2="330" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="65" y="334" font-family="Nunito, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" text-anchor="end">−30 m</text>

  <!-- Línea guía hacia el submarino en -20 m -->
  <line x1="90" y1="250" x2="260" y2="250" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Submarino centrado en Y=250 -->
  <g transform="translate(260, 200)">
    <!-- Hélice trasera -->
    <rect x="0" y="38" width="12" height="24" rx="4" fill="#D97706"/>
    <!-- Timón -->
    <path d="M20,25 L10,10 L30,15 Z" fill="#D97706"/>
    <path d="M20,75 L10,90 L30,85 Z" fill="#D97706"/>
    <!-- Cuerpo del submarino -->
    <ellipse cx="110" cy="50" rx="90" ry="38" fill="url(#subGrad)"/>
    <!-- Torreta / Periscopio -->
    <rect x="95" y="2" width="28" height="22" rx="6" fill="#D97706"/>
    <path d="M106,2 L106,-8 L116,-8" stroke="#D97706" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Ventanas ojos de buey -->
    <circle cx="80" cy="50" r="14" fill="#0284C7" stroke="#FEF3C7" stroke-width="3"/>
    <circle cx="120" cy="50" r="14" fill="#0284C7" stroke="#FEF3C7" stroke-width="3"/>
    <circle cx="80" cy="50" r="9" fill="#38BDF8"/>
    <circle cx="120" cy="50" r="9" fill="#38BDF8"/>
    <circle cx="83" cy="47" r="3" fill="#FFFFFF"/>
    <circle cx="123" cy="47" r="3" fill="#FFFFFF"/>
    <!-- Sonrisa amigable en la proa -->
    <path d="M170,55 Q180,62 188,52" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="178" cy="46" r="3" fill="#78350F"/>
  </g>

  <!-- Burbujas decorativas simples -->
  <circle cx="250" cy="230" r="4" fill="#7DD3FC" opacity="0.6"/>
  <circle cx="240" cy="210" r="6" fill="#7DD3FC" opacity="0.5"/>
  <circle cx="480" cy="220" r="5" fill="#7DD3FC" opacity="0.5"/>

  <!-- Placa explicativa limpia en español -->
  <rect x="230" y="315" width="310" height="42" rx="12" fill="#082F49" stroke="#0284C7" stroke-width="1.5"/>
  <text x="385" y="341" font-family="Nunito, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Posición del submarino: −20 metros</text>
</svg>
