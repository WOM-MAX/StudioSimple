<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="34" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Profundidad Marina</text>
  <text x="300" y="52" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Escala vertical con referencia en la superficie del mar (0 m)</text>

  <!-- Mar (area recortada) -->
  <rect x="50" y="70" width="500" height="145" rx="12" fill="#E0F2FE"/>

  <!-- Nivel del mar (0 m) -->
  <line x1="50" y1="70" x2="550" y2="70" stroke="#0284C7" stroke-width="2.5"/>
  <text x="70" y="64" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#0284C7">Superficie: 0 m</text>

  <!-- Eje de profundidad -->
  <line x1="120" y1="70" x2="120" y2="205" stroke="#94A3B8" stroke-width="2"/>

  <!-- Marcas de profundidad -->
  <line x1="112" y1="115" x2="128" y2="115" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="102" y="119" font-family="Nunito, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="end">−10 m</text>

  <line x1="110" y1="160" x2="130" y2="160" stroke="#EE751C" stroke-width="2.5"/>
  <text x="102" y="164" font-family="Nunito, sans-serif" font-size="12" font-weight="900" fill="#EE751C" text-anchor="end">−20 m</text>

  <!-- Submarino esquematico limpio en Y=160 -->
  <g transform="translate(260, 135)">
    <!-- Cuerpo -->
    <ellipse cx="60" cy="25" rx="60" ry="22" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <!-- Torreta -->
    <rect x="50" y="-3" width="18" height="15" rx="4" fill="#D97706"/>
    <!-- Periscopio -->
    <path d="M57,-3 L57,-10 L65,-10" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Ventanas -->
    <circle cx="40" cy="25" r="8" fill="#E0F2FE" stroke="#B45309" stroke-width="2"/>
    <circle cx="70" cy="25" r="8" fill="#E0F2FE" stroke="#B45309" stroke-width="2"/>
    <!-- Helice -->
    <rect x="-8" y="17" width="8" height="16" rx="3" fill="#B45309"/>
  </g>
</svg>
