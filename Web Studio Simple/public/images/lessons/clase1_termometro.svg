<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="34" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Escala Térmica</text>
  <text x="300" y="52" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Observa la columna respecto a la marca de 0 °C</text>

  <!-- Termometro vertical central -->
  <g transform="translate(280, 65)">
    <!-- Tubo exterior -->
    <rect x="-10" y="0" width="20" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="0" cy="120" r="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Liquido hasta -4 °C (0 °C en Y=40, -4 °C en Y=68) -->
    <rect x="-5" y="68" width="10" height="46" rx="5" fill="#0284C7"/>
    <circle cx="0" cy="120" r="13" fill="#0284C7"/>

    <!-- Linea de 0 °C -->
    <line x1="-30" y1="40" x2="30" y2="40" stroke="#0284C7" stroke-width="2"/>
    <text x="38" y="44" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#0284C7">0 °C</text>

    <!-- Marca de 4 grados bajo cero -->
    <line x1="-30" y1="68" x2="30" y2="68" stroke="#EE751C" stroke-width="2"/>
    <text x="38" y="72" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#EE751C">4 °C bajo cero</text>
  </g>
</svg>
