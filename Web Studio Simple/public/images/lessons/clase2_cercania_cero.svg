<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad6)"/>

  <!-- Título pedagógico claro -->
  <text x="300" y="50" font-family="Nunito, sans-serif" font-size="20" font-weight="900" fill="#1C3257" text-anchor="middle">¿Cuál está más cerca del cero?</text>
  <text x="300" y="75" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Comparando la distancia al cero entre −1 y −4</text>

  <!-- Recta numérica horizontal (Y=210) -->
  <line x1="60" y1="210" x2="540" y2="210" stroke="#1E293B" stroke-width="3.5"/>
  <polygon points="50,210 65,203 65,217" fill="#1E293B"/>
  <polygon points="550,210 535,203 535,217" fill="#1E293B"/>

  <!-- Marcas y números -->
  <!-- -5 -->
  <line x1="100" y1="200" x2="100" y2="220" stroke="#94A3B8" stroke-width="2"/>
  <text x="100" y="244" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−5</text>

  <!-- -4 (Destacado) -->
  <circle cx="170" cy="210" r="10" fill="#EF4444"/>
  <line x1="170" y1="198" x2="170" y2="222" stroke="#EF4444" stroke-width="3"/>
  <text x="170" y="250" font-family="Nunito, sans-serif" font-size="17" font-weight="900" fill="#DC2626" text-anchor="middle">−4</text>

  <!-- -3 -->
  <line x1="240" y1="200" x2="240" y2="220" stroke="#94A3B8" stroke-width="2"/>
  <text x="240" y="244" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−3</text>

  <!-- -2 -->
  <line x1="310" y1="200" x2="310" y2="220" stroke="#94A3B8" stroke-width="2"/>
  <text x="310" y="244" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−2</text>

  <!-- -1 (Destacado con éxito) -->
  <circle cx="380" cy="210" r="12" fill="#10B981" stroke="#059669" stroke-width="2.5"/>
  <text x="380" y="250" font-family="Nunito, sans-serif" font-size="18" font-weight="900" fill="#059669" text-anchor="middle">−1</text>

  <!-- 0 (Origen) -->
  <circle cx="450" cy="210" r="14" fill="#F59E0B" stroke="#B45309" stroke-width="2.5"/>
  <text x="450" y="215" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="450" y="248" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">CERO</text>

  <!-- +1 -->
  <line x1="510" y1="200" x2="510" y2="220" stroke="#94A3B8" stroke-width="2"/>
  <text x="510" y="244" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">+1</text>

  <!-- Arco corto: desde 0 a -1 (1 paso) -->
  <path d="M450,195 Q415,145 380,195" fill="none" stroke="#10B981" stroke-width="3.5"/>
  <polygon points="380,195 382,185 390,190" fill="#10B981"/>
  <rect x="360" y="125" width="110" height="26" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="415" y="142" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">Solo 1 paso</text>

  <!-- Arco largo: desde 0 a -4 (4 pasos) -->
  <path d="M450,195 Q310,75 170,195" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="170,195 174,185 182,190" fill="#EF4444"/>
  <rect x="250" y="85" width="120" height="26" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="310" y="102" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="middle">4 pasos de distancia</text>

  <!-- Conclusión pedagógica inferior -->
  <rect x="80" y="295" width="440" height="50" rx="14" fill="#065F46"/>
  <text x="300" y="325" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">El −1 está a 1 solo paso del cero: ¡está más cerca!</text>
</svg>
