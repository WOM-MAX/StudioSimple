<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad8)"/>

  <!-- Título pedagógico -->
  <text x="300" y="50" font-family="Nunito, sans-serif" font-size="20" font-weight="900" fill="#1C3257" text-anchor="middle">Comparando Números Negativos: −5 vs −2</text>
  <text x="300" y="75" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Aunque el 5 parece mayor, en los negativos el que está más a la derecha gana</text>

  <!-- Recta numérica horizontal (Y=190) -->
  <line x1="50" y1="190" x2="550" y2="190" stroke="#334155" stroke-width="4"/>
  <polygon points="40,190 55,183 55,197" fill="#334155"/>
  <polygon points="560,190 545,183 545,197" fill="#334155"/>

  <!-- -6 -->
  <line x1="90" y1="180" x2="90" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <text x="90" y="224" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−6</text>

  <!-- -5 (Destacado - Izquierda) -->
  <circle cx="160" cy="190" r="14" fill="#F87171" stroke="#DC2626" stroke-width="3"/>
  <text x="160" y="196" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">−5</text>
  <rect x="120" y="225" width="80" height="26" rx="8" fill="#FEE2E2"/>
  <text x="160" y="242" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#991B1B" text-anchor="middle">Menor</text>

  <!-- -4 -->
  <line x1="230" y1="180" x2="230" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <text x="230" y="224" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−4</text>

  <!-- -3 -->
  <line x1="300" y1="180" x2="300" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <text x="300" y="224" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−3</text>

  <!-- -2 (Destacado - Derecha / Mayor) -->
  <circle cx="370" cy="190" r="16" fill="#34D399" stroke="#059669" stroke-width="3.5"/>
  <text x="370" y="196" font-family="Nunito, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle">−2</text>
  <rect x="325" y="225" width="90" height="26" rx="8" fill="#D1FAE5"/>
  <text x="370" y="242" font-family="Nunito, sans-serif" font-size="12" font-weight="900" fill="#065F46" text-anchor="middle">¡MAYOR!</text>

  <!-- -1 -->
  <line x1="440" y1="180" x2="440" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <text x="440" y="224" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle">−1</text>

  <!-- 0 (Origen) -->
  <circle cx="510" cy="190" r="12" fill="#F59E0B"/>
  <text x="510" y="195" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="510" y="224" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#D97706" text-anchor="middle">Cero</text>

  <!-- Flecha explicativa de avance hacia la derecha -->
  <path d="M180,165 Q275,120 350,165" fill="none" stroke="#059669" stroke-width="3.5"/>
  <polygon points="350,165 340,158 344,150" fill="#059669"/>
  <rect x="200" y="105" width="150" height="24" rx="12" fill="#065F46"/>
  <text x="275" y="121" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Aumenta hacia la derecha →</text>

  <!-- Conclusión pedagógica inferior -->
  <rect x="60" y="295" width="480" height="52" rx="14" fill="#065F46"/>
  <text x="300" y="327" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">El −2 está más a la derecha que el −5  ➜  −2 es mayor que −5 (−2 &gt; −5)</text>
</svg>
