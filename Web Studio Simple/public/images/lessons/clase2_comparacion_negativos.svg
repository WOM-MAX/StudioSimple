<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="42" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Comparación en la Recta Numérica</text>
  <text x="300" y="64" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Ubicación de −5 y −2 en la escala de enteros</text>

  <!-- Recta horizontal (Y=140) -->
  <line x1="50" y1="140" x2="550" y2="140" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="40,140 55,133 55,147" fill="#334155"/>
  <polygon points="560,140 545,133 545,147" fill="#334155"/>

  <!-- -6 -->
  <line x1="90" y1="132" x2="90" y2="148" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="90" y="172" font-family="Nunito, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">−6</text>

  <!-- -5 (Punto bajo analisis) -->
  <line x1="160" y1="118" x2="160" y2="152" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="160" cy="140" r="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="160" y="176" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#1D4ED8" text-anchor="middle">−5</text>

  <!-- -4 -->
  <line x1="230" y1="132" x2="230" y2="148" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="230" y="172" font-family="Nunito, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">−4</text>

  <!-- -3 -->
  <line x1="300" y1="132" x2="300" y2="148" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="172" font-family="Nunito, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">−3</text>

  <!-- -2 (Punto bajo analisis) -->
  <line x1="370" y1="118" x2="370" y2="152" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="370" cy="140" r="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="370" y="176" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#1D4ED8" text-anchor="middle">−2</text>

  <!-- -1 -->
  <line x1="440" y1="132" x2="440" y2="148" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="440" y="172" font-family="Nunito, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">−1</text>

  <!-- 0 (Origen) -->
  <circle cx="510" cy="140" r="12" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <text x="510" y="145" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="510" y="176" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">ORIGEN</text>
</svg>
