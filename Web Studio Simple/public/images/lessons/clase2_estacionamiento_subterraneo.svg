<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="32" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Niveles de Subterráneo en un Edificio</text>
  <text x="300" y="50" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Esquema vertical de pisos respecto a la calle (nivel 0)</text>

  <!-- Corte vertical del edificio -->
  <g transform="translate(150, 60)">
    <!-- Piso 0 Calle -->
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="15" y="22" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#1E293B">PISO 0 · Nivel Calle</text>

    <!-- Linea de tierra -->
    <line x1="-15" y1="34" x2="235" y2="34" stroke="#475569" stroke-width="2.5"/>

    <!-- Piso -1 -->
    <rect x="0" y="40" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="15" y="62" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#0284C7">PISO −1 · Subterráneo 1</text>

    <!-- Piso -2 -->
    <rect x="0" y="80" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="15" y="102" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#64748B">PISO −2 · Subterráneo 2</text>

    <!-- Piso -3 -->
    <rect x="0" y="120" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="15" y="142" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#0284C7">PISO −3 · Subterráneo 3</text>

    <!-- Flecha de desplazamiento de -3 a -1 -->
    <line x1="255" y1="137" x2="255" y2="60" stroke="#EE751C" stroke-width="3" stroke-linecap="round"/>
    <polygon points="255,50 248,63 262,63" fill="#EE751C"/>
    <text x="268" y="102" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#EE751C">Subida</text>
  </g>
</svg>
