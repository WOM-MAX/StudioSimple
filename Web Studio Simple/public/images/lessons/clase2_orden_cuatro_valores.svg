<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="orderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad11)"/>

  <!-- Título pedagógico -->
  <text x="300" y="45" font-family="Nunito, sans-serif" font-size="20" font-weight="900" fill="#1C3257" text-anchor="middle">Ordenando Cuatro Valores de Menor a Mayor</text>
  <text x="300" y="70" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Se leen directamente de izquierda a derecha en la recta numérica</text>

  <!-- Flecha guía superior de orden -->
  <g transform="translate(70, 95)">
    <rect x="0" y="6" width="430" height="12" rx="6" fill="url(#orderGrad)"/>
    <polygon points="430,0 455,12 430,24" fill="#10B981"/>
    <rect x="130" y="-8" width="190" height="22" rx="11" fill="#0F172A"/>
    <text x="225" y="7" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">DE MENOR A MAYOR →</text>
  </g>

  <!-- Recta numérica horizontal (Y=195) -->
  <line x1="40" y1="195" x2="560" y2="195" stroke="#334155" stroke-width="3.5"/>
  <polygon points="30,195 45,188 45,202" fill="#334155"/>
  <polygon points="570,195 555,188 555,202" fill="#334155"/>

  <!-- Valores en la recta: escala paso = 45px, Centro 0 en X=390 -->
  <!-- -7 -->
  <line x1="75" y1="188" x2="75" y2="202" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- 1. -6 (DESTACADO) X=120 -->
  <circle cx="120" cy="195" r="14" fill="#EF4444" stroke="#B91C1C" stroke-width="2.5"/>
  <text x="120" y="200" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">−6</text>
  <rect x="85" y="225" width="70" height="42" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="120" y="242" font-family="Nunito, sans-serif" font-size="11" font-weight="900" fill="#DC2626" text-anchor="middle">1° Menor</text>
  <text x="120" y="258" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#991B1B" text-anchor="middle">−6</text>

  <!-- -5, -4, -3, -2 -->
  <line x1="165" y1="188" x2="165" y2="202" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="210" y1="188" x2="210" y2="202" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="255" y1="188" x2="255" y2="202" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="188" x2="300" y2="202" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- 2. -1 (DESTACADO) X=345 -->
  <circle cx="345" cy="195" r="14" fill="#F59E0B" stroke="#B45309" stroke-width="2.5"/>
  <text x="345" y="200" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">−1</text>
  <rect x="315" y="225" width="60" height="42" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="345" y="242" font-family="Nunito, sans-serif" font-size="11" font-weight="900" fill="#D97706" text-anchor="middle">2°</text>
  <text x="345" y="258" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#92400E" text-anchor="middle">−1</text>

  <!-- 3. 0 (DESTACADO) X=390 -->
  <circle cx="390" cy="195" r="14" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
  <text x="390" y="200" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">0</text>
  <rect x="365" y="225" width="50" height="42" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="390" y="242" font-family="Nunito, sans-serif" font-size="11" font-weight="900" fill="#0284C7" text-anchor="middle">3°</text>
  <text x="390" y="258" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#0369A1" text-anchor="middle">0</text>

  <!-- +1, +2 -->
  <line x1="435" y1="188" x2="435" y2="202" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="480" y1="188" x2="480" y2="202" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- 4. +3 (DESTACADO) X=525 -->
  <circle cx="525" cy="195" r="14" fill="#10B981" stroke="#047857" stroke-width="2.5"/>
  <text x="525" y="200" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">+3</text>
  <rect x="490" y="225" width="70" height="42" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="525" y="242" font-family="Nunito, sans-serif" font-size="11" font-weight="900" fill="#059669" text-anchor="middle">4° Mayor</text>
  <text x="525" y="258" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#065F46" text-anchor="middle">+3</text>

  <!-- Conclusión pedagógica inferior -->
  <rect x="70" y="300" width="460" height="52" rx="14" fill="#0F172A"/>
  <text x="300" y="332" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">Orden de menor a mayor:  −6,  −1,  0,  +3</text>
</svg>
