<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="38" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Valores en la Recta Numérica</text>
  <text x="300" y="58" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Observa las cuatro posiciones señaladas a lo largo del eje</text>

  <!-- Recta horizontal (Y=140) -->
  <line x1="40" y1="140" x2="560" y2="140" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="30,140 45,133 45,147" fill="#334155"/>
  <polygon points="570,140 555,133 555,147" fill="#334155"/>

  <!-- Marcas intermedias neutras -->
  <line x1="165" y1="133" x2="165" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="210" y1="133" x2="210" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="255" y1="133" x2="255" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="300" y1="133" x2="300" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="435" y1="133" x2="435" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="480" y1="133" x2="480" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Punto 1: -6 (X=120) -->
  <line x1="120" y1="120" x2="120" y2="150" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="120" cy="140" r="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="120" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#1D4ED8" text-anchor="middle">−6</text>

  <!-- Punto 2: -1 (X=345) -->
  <line x1="345" y1="120" x2="345" y2="150" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="345" cy="140" r="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="345" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#1D4ED8" text-anchor="middle">−1</text>

  <!-- Punto 3: 0 (Origen X=390) -->
  <circle cx="390" cy="140" r="12" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <text x="390" y="145" font-family="Nunito, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="390" y="174" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">0</text>

  <!-- Punto 4: +3 (X=525) -->
  <line x1="525" y1="120" x2="525" y2="150" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="525" cy="140" r="10" fill="#10B981" stroke="#047857" stroke-width="2"/>
  <text x="525" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">+3</text>
</svg>
