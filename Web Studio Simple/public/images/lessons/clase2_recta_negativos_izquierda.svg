<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="42" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Recta Numérica Horizontal</text>
  <text x="300" y="64" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Eje de los números enteros con origen en cero</text>

  <!-- Recta horizontal (Y=140) -->
  <line x1="50" y1="140" x2="550" y2="140" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Flechas extremas -->
  <polygon points="40,140 55,133 55,147" fill="#334155"/>
  <polygon points="560,140 545,133 545,147" fill="#334155"/>

  <!-- Graduaciones y numeros -->
  <!-- -5 -->
  <line x1="85" y1="130" x2="85" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="85" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">−5</text>

  <!-- -4 -->
  <line x1="130" y1="130" x2="130" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="130" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">−4</text>

  <!-- -3 -->
  <line x1="175" y1="130" x2="175" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="175" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">−3</text>

  <!-- -2 -->
  <line x1="220" y1="130" x2="220" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="220" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">−2</text>

  <!-- -1 -->
  <line x1="265" y1="130" x2="265" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="265" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">−1</text>

  <!-- 0 Origen central -->
  <circle cx="300" cy="140" r="14" fill="#F59E0B" stroke="#D97706" stroke-width="2.5"/>
  <text x="300" y="145" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="300" y="176" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">ORIGEN</text>

  <!-- +1 -->
  <line x1="335" y1="130" x2="335" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="335" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">+1</text>

  <!-- +2 -->
  <line x1="380" y1="130" x2="380" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="380" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">+2</text>

  <!-- +3 -->
  <line x1="425" y1="130" x2="425" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="425" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">+3</text>

  <!-- +4 -->
  <line x1="470" y1="130" x2="470" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="470" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">+4</text>

  <!-- +5 -->
  <line x1="515" y1="130" x2="515" y2="150" stroke="#64748B" stroke-width="2"/>
  <text x="515" y="174" font-family="Nunito, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">+5</text>
</svg>
