<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad7)"/>

  <!-- Título pedagógico -->
  <text x="300" y="50" font-family="Nunito, sans-serif" font-size="20" font-weight="900" fill="#1C3257" text-anchor="middle">La Regla de la Derecha</text>
  <text x="300" y="75" font-family="Nunito, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">En la recta numérica, el número que está más a la derecha es mayor</text>

  <!-- Gran flecha indicadora superior -->
  <g transform="translate(100, 100)">
    <rect x="0" y="8" width="370" height="16" rx="8" fill="url(#arrowGrad)"/>
    <polygon points="365,0 400,16 365,32" fill="#10B981"/>
    <rect x="110" y="-8" width="180" height="24" rx="12" fill="#1E293B"/>
    <text x="200" y="9" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">LOS VALORES AUMENTAN →</text>
  </g>

  <!-- Recta numérica horizontal (Y=210) -->
  <line x1="60" y1="210" x2="540" y2="210" stroke="#334155" stroke-width="4"/>
  <polygon points="50,210 65,203 65,217" fill="#334155"/>
  <polygon points="550,210 535,203 535,217" fill="#334155"/>

  <!-- Punto B (Izquierda / Menor) -->
  <g transform="translate(170, 210)">
    <circle cx="0" cy="0" r="16" fill="#3B82F6" stroke="#1D4ED8" stroke-width="3"/>
    <text x="0" y="6" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
    <rect x="-45" y="30" width="90" height="26" rx="8" fill="#DBEAFE"/>
    <text x="0" y="47" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#1E40AF" text-anchor="middle">Izquierda</text>
  </g>

  <!-- Punto A (Derecha / Mayor) -->
  <g transform="translate(430, 210)">
    <circle cx="0" cy="0" r="18" fill="#10B981" stroke="#047857" stroke-width="3.5"/>
    <text x="0" y="7" font-family="Nunito, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    <rect x="-55" y="30" width="110" height="26" rx="8" fill="#D1FAE5"/>
    <text x="0" y="47" font-family="Nunito, sans-serif" font-size="12" font-weight="800" fill="#065F46" text-anchor="middle">Más a la derecha</text>
  </g>

  <!-- Flecha de relación entre B y A -->
  <path d="M195,190 Q300,150 405,190" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="405,190 395,183 400,175" fill="#F59E0B"/>

  <!-- Conclusión pedagógica inferior -->
  <rect x="70" y="300" width="460" height="52" rx="14" fill="#0F172A"/>
  <text x="300" y="332" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">A está a la derecha de B  ➜  El número A es mayor (A &gt; B)</text>
</svg>
