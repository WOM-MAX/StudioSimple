<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="42" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Posición Relativa en la Recta</text>
  <text x="300" y="64" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Dos valores A y B ubicados en el eje horizontal</text>

  <!-- Recta horizontal (Y=140) -->
  <line x1="60" y1="140" x2="540" y2="140" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="50,140 65,133 65,147" fill="#334155"/>
  <polygon points="550,140 535,133 535,147" fill="#334155"/>

  <!-- Punto B -->
  <circle cx="200" cy="140" r="16" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="200" y="146" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="200" y="180" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">Punto B</text>

  <!-- Punto A -->
  <circle cx="400" cy="140" r="16" fill="#10B981" stroke="#047857" stroke-width="2.5"/>
  <text x="400" y="146" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="400" y="180" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#065F46" text-anchor="middle">Punto A</text>

  <!-- Guia visual neutra entre B y A -->
  <path d="M225,125 Q300,105 375,125" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
