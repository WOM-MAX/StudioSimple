<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Titulo minimalista neutro -->
  <text x="300" y="38" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#1C3257" text-anchor="middle">Registro de Temperaturas</text>
  <text x="300" y="58" font-family="Nunito, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Comparacion de valores bajo cero respecto al origen 0 °C</text>

  <!-- Linea de referencia 0 °C -->
  <line x1="120" y1="110" x2="480" y2="110" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="495" y="114" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">0 °C</text>

  <!-- Termometro 1: Mañana (-3 °C) -->
  <g transform="translate(190, 80)">
    <rect x="-10" y="10" width="20" height="100" rx="10" fill="#E2E8F0"/>
    <circle cx="0" cy="115" r="16" fill="#0284C7"/>
    <!-- Columna liquida hasta -3 °C -->
    <rect x="-6" y="50" width="12" height="65" rx="6" fill="#0284C7"/>
    <!-- Etiqueta Mañana -->
    <text x="0" y="-5" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#0369A1" text-anchor="middle">Mañana</text>
    <text x="0" y="145" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#0369A1" text-anchor="middle">−3 °C</text>
  </g>

  <!-- Termometro 2: Noche (-8 °C) -->
  <g transform="translate(380, 80)">
    <rect x="-10" y="10" width="20" height="100" rx="10" fill="#E2E8F0"/>
    <circle cx="0" cy="115" r="16" fill="#3B82F6"/>
    <!-- Columna liquida hasta -8 °C -->
    <rect x="-6" y="80" width="12" height="35" rx="6" fill="#3B82F6"/>
    <!-- Etiqueta Noche -->
    <text x="0" y="-5" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">Noche</text>
    <text x="0" y="145" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#475569" text-anchor="middle">−8 °C</text>
  </g>
</svg>
