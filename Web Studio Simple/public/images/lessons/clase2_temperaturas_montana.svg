<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="mntGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="380" rx="20" fill="url(#bgGrad9)"/>

  <!-- Siluetas sutiles de montañas de fondo -->
  <polygon points="40,160 140,50 240,160" fill="url(#mntGrad)" opacity="0.25"/>
  <polygon points="120,70 140,50 160,70 150,75 140,70 130,75" fill="#FFFFFF"/>

  <polygon points="180,170 320,30 460,170" fill="url(#mntGrad)" opacity="0.3"/>
  <polygon points="290,60 320,30 350,60 335,68 320,60 305,68" fill="#FFFFFF"/>

  <polygon points="380,160 480,60 580,160" fill="url(#mntGrad)" opacity="0.25"/>
  <polygon points="460,80 480,60 500,80 490,85 480,80 470,85" fill="#FFFFFF"/>

  <!-- Título pedagógico -->
  <text x="300" y="42" font-family="Nunito, sans-serif" font-size="18" font-weight="900" fill="#0C4A6E" text-anchor="middle">Temperaturas en la Cordillera</text>
  <text x="300" y="62" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">Comparando temperaturas bajo cero</text>

  <!-- Tarjeta Mañana (Izquierda) -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="220" height="210" rx="18" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    
    <rect x="15" y="15" width="90" height="24" rx="8" fill="#FEF3C7"/>
    <text x="60" y="31" font-family="Nunito, sans-serif" font-size="11" font-weight="900" fill="#92400E" text-anchor="middle">MAÑANA</text>

    <!-- Termómetro Mañana -->
    <rect x="40" y="55" width="20" height="110" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="50" cy="170" r="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Columna hasta -3 °C (más alta que -8) -->
    <rect x="44" y="95" width="12" height="70" rx="6" fill="#0284C7"/>
    <circle cx="50" cy="170" r="12" fill="#0284C7"/>

    <text x="135" y="95" font-family="Nunito, sans-serif" font-size="28" font-weight="900" fill="#0369A1" text-anchor="middle">−3 °C</text>
    <rect x="85" y="115" width="115" height="26" rx="8" fill="#E0F2FE"/>
    <text x="142" y="132" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#0369A1" text-anchor="middle">Menos fría</text>

    <rect x="20" y="160" width="180" height="32" rx="10" fill="#0284C7"/>
    <text x="110" y="181" font-family="Nunito, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">TEMPERATURA MAYOR</text>
  </g>

  <!-- Tarjeta Noche (Derecha) -->
  <g transform="translate(320, 85)">
    <rect x="0" y="0" width="220" height="210" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <rect x="15" y="15" width="90" height="24" rx="8" fill="#1E293B"/>
    <text x="60" y="31" font-family="Nunito, sans-serif" font-size="11" font-weight="900" fill="#94A3B8" text-anchor="middle">NOCHE</text>

    <!-- Termómetro Noche -->
    <rect x="40" y="55" width="20" height="110" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="50" cy="170" r="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Columna hasta -8 °C (más baja que -3) -->
    <rect x="44" y="135" width="12" height="30" rx="6" fill="#3B82F6"/>
    <circle cx="50" cy="170" r="12" fill="#3B82F6"/>

    <text x="135" y="95" font-family="Nunito, sans-serif" font-size="28" font-weight="900" fill="#64748B" text-anchor="middle">−8 °C</text>
    <rect x="85" y="115" width="115" height="26" rx="8" fill="#F1F5F9"/>
    <text x="142" y="132" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">Más fría</text>

    <rect x="20" y="160" width="180" height="32" rx="10" fill="#64748B"/>
    <text x="110" y="181" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Temperatura menor</text>
  </g>

  <!-- Conclusión inferior limpia -->
  <rect x="60" y="312" width="480" height="46" rx="12" fill="#0C4A6E"/>
  <text x="300" y="340" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">−3 °C es mayor que −8 °C porque está más cerca del cero (−3 &gt; −8)</text>
</svg>
